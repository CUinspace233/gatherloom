[project]
name = "gatherloom-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "argon2-cffi",
    "fastapi",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langgraph==1.2.20",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-postgres==3.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary]",
    "pydantic",
    "python-multipart",
    "sqlalchemy",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["jieba"]
ignore_missing_imports = true
