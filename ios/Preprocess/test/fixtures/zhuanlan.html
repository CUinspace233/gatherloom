<h1 class="Post-Title">pgvector 混合检索入门</h1>
<div class="AuthorInfo"><span class="AuthorInfo-name">李四</span></div>
<div class="Post-RichText"><p>混合检索把关键词检索与向量检索结合起来。PostgreSQL 的全文检索负责精确匹配术语，pgvector 负责语义相似。</p><p>常见的融合方式是 RRF（倒数排名融合），它只依赖排名，不需要对两路分数做归一化。</p><h2>中文分词</h2><p>PostgreSQL 没有内置中文分词，可以在应用侧用 jieba 分词后写入 simple 配置的 tsvector。</p></div>
