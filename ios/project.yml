name: Gatherloom
options:
  deploymentTarget:
    iOS: '26.0'
  developmentLanguage: zh-Hans
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
fileGroups:
  - Config/Debug-Info.plist
  - Config/Gatherloom.entitlements
  - Config/ShareExtension-Info.plist
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    SWIFT_VERSION: '5.0'
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Gatherloom:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: GatherloomShareExtension
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/Gatherloom.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Gatherloom
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cuinspace233.gatherloom
        TARGETED_DEVICE_FAMILY: '1'
      configs:
        Debug:
          INFOPLIST_FILE: Config/Debug-Info.plist
  GatherloomShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/Gatherloom.entitlements
        INFOPLIST_FILE: Config/ShareExtension-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cuinspace233.gatherloom.share
        TARGETED_DEVICE_FAMILY: '1'
schemes:
  Gatherloom:
    build:
      targets:
        Gatherloom: all
