name: Server checks

on:
  push:
    paths:
      - 'server/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy app tests evaluation
      - run: docker compose -f ../deploy/compose.yaml up -d --wait postgres
      - run: docker compose -f ../deploy/compose.yaml exec -T postgres createdb -U gatherloom gatherloom_test
      - run: uv run --locked python -m pytest
        env:
          GATHERLOOM_TEST_DATABASE_URL: postgresql+psycopg://gatherloom:gatherloom-local@127.0.0.1:54329/gatherloom_test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f server/Dockerfile server
      - run: cp deploy/env.prod.example deploy/.env.prod
      - run: docker compose -f deploy/compose.prod.yaml --env-file deploy/.env.prod config -q
        env:
          POSTGRES_PASSWORD: ci


  # After the checks pass on main, the server pulls and restarts itself. The
  # key is limited to scripts/deploy.sh by a forced command in authorized_keys
  # (docs/operations.md).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, image]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Run scripts/deploy.sh on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" deploy
