# Retrieval questions. A question passes when any target appears in the top 5
# entries. scope: a project key from materials.yaml, or "global" for the
# whole account. Queries are phrased the way a user would ask, mostly not
# reusing the material's own wording.

questions:
  - id: r01
    account: eval_a
    scope: A1
    query: SwiftUI 状态管理用什么方案
    targets: [a1-01]
    tests: 想法，中英混合

  - id: r02
    account: eval_a
    scope: A1
    query: 上传失败重试会不会产生重复记录
    targets: [a1-02]
    tests: 长网页，语义改写（幂等键）

  - id: r03
    account: eval_a
    scope: A1
    query: 断网恢复后大量设备同时重连怎么避免压垮服务器
    targets: [a1-02]
    tests: 长网页中段（指数退避与抖动）

  - id: r04
    account: eval_a
    scope: A1
    query: RRF 的 k 一般取多少
    targets: [a1-03]
    tests: 关键词 + 长网页

  - id: r05
    account: eval_a
    scope: A1
    query: 中文全文检索怎么分词
    targets: [a1-03, a1-09]
