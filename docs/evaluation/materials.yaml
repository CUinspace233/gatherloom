  - id: a1-02
    account: eval_a
    project: A1
    type: url
    url: https://example.com/blog/offline-first-sync
    title: 离线优先应用的同步与幂等设计
    note: 上传队列参考
    body: |
      离线优先（offline-first）的核心原则是：用户的每一次保存都先落到本机持久存储，网络只是后台的搬运工。界面上“已保存”的含义必须诚实，只有本机文件和提交清单都写盘成功后才能显示。

      上传队列的每个提交都应该带一个客户端生成的幂等键（idempotency key）。服务端以“账号 + 幂等键”为唯一约束，同一个键重复提交时返回第一次创建的记录，而不是再建一条。这样客户端可以放心地在超时后重试，不用担心重复。

      重试策略推荐指数退避：第一次失败等 2 秒，之后翻倍，上限 5 分钟，并加入随机抖动，避免大量设备同时恢复网络时把服务器打垮。App 回到前台时立即尝试一次，不必等退避计时结束。

      冲突处理上，个人知识库的大多数内容只有一个编辑者，不需要 CRDT。对“编辑已有记录”这种少见操作，使用版本号做乐观并发控制：请求带上 base_revision，服务器发现版本已变化就返回 409，由用户决定是否覆盖。

      账号切换是最容易被忽略的场景：待上传队列必须按账号分目录保存，切换账号后旧账号的内容暂停上传，绝不能提交到新账号下。

  - id: a1-03
    account: eval_a
    project: A1
    type: url
    url: https://example.com/notes/pgvector-hybrid-search
    title: 用 pgvector 和全文检索做混合搜索
    note: 检索方案主参考
    body: |
      PostgreSQL 的全文检索和 pgvector 可以在同一个数据库里组成混合搜索：关键词路负责精确词匹配，向量路负责语义相近。两路分别取前 50 个候选，再融合排序。

      融合最常用的是 RRF（Reciprocal Rank Fusion，倒数排名融合）：每个结果在每一路的得分是 1/(k + 排名)，k 通常取 60，各路得分相加。RRF 只看名次不看原始分数，因此不需要把 ts_rank 和余弦距离归一化到同一量纲，这是它最大的优点。

      数据量小的时候（几万行以内）直接做精确的向量距离排序就够了，先保证正确性，再在延迟不可接受时加 HNSW 或 IVFFlat 近似索引。近似索引会牺牲少量召回率，需要用评测集确认影响。

      中文全文检索需要先分词。PostgreSQL 内置的解析器不认识中文词边界，常见做法是在应用侧用 jieba 分词后以空格连接，再交给 to_tsvector('simple', ...)。查询时必须使用同一个分词器和词典，否则两侧切出来的词对不上。

