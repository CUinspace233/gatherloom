  - id: a1-12
    account: eval_a
    project: A1
    type: url
    url: https://example.com/guide/reranker-tradeoffs
    title: 要不要加 Reranker？小型 RAG 系统的取舍
    note: 暂不加 reranker
    body: |
      Cross-encoder 重排（reranker）通常能在混合检索之后进一步提升前几名的准确度，但它带来三个成本：每次查询多一次模型调用、增加几百毫秒延迟、多一个外部依赖。

      对于资料量在几千条以内的个人知识库，更划算的顺序是：先把分块和上下文头做好，再看混合检索的 Top 5 命中率；只有在评测集上明显达不到目标时，才引入 reranker，并且要设置超时降级，失败时回到原来的排序。

      另一个常被低估的改进是给每个分块加上下文头：把文档标题和章节名拼到分块前面再索引，能显著减少“分块脱离上下文”导致的漏召回。

