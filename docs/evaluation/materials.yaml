  # ---------- A2 家庭咖啡烘焙 ----------
  - id: a2-01
    account: eval_a
    project: A2
    type: url
    url: https://example.com/coffee/roast-stages
    title: 家庭烘焙的四个阶段
    note: 入门
    body: |
      咖啡烘焙大致分为脱水、梅纳反应、一爆和发展四个阶段。脱水阶段生豆由青绿转黄，散发草腥味，通常持续 4 到 6 分钟。

      梅纳反应阶段豆子转为浅褐色，开始出现烤面包和焦糖的香气。这个阶段升温过快会让豆子表面焦而内部不熟。

      一爆时会听到类似爆米花的噼啪声，这是豆子内部水汽和二氧化碳冲破细胞壁。一爆开始后进入发展阶段，发展时间一般占总烘焙时间的 15% 到 25%，时间越长风味越偏焦糖和苦甜，越短越偏酸和果香。

      出锅后要在 3 分钟内把豆子冷却到室温，否则余温会继续烘焙，风味变得平淡。

