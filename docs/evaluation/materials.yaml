  - id: a1-17
    account: eval_a
    project: A1
    type: url
    url: https://example.com/blog/chinese-chunking
    title: 中文长文分块的几个经验
    note: 分块参数
    body: |
      中文没有空格，按固定字符数切块很容易把一句话切成两半。更稳妥的做法是先按段落切，段落太长再按句号、问号、感叹号切，最后才按字数硬切。

      块的大小建议在 300 到 800 字之间。太短的块缺少上下文，语义向量不稳定；太长的块会把多个主题混在一起，关键词得分被稀释。相邻块之间重叠一句话，可以缓解边界处的信息丢失。

      短文本（比如一句想法）不要切，整条作为一个块索引。截图 OCR 出来的文字经常是零散的短行，可以先合并成段落再处理。

      记录每个块在原文中的起止位置，引用时才能准确跳回原文。

