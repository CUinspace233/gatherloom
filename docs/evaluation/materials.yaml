  # ---------- B1 向量数据库调优（另一个账号）----------
  - id: b1-01
    account: eval_b
    project: B1
    type: url
    url: https://example.com/pgvector/hnsw-tuning
    title: pgvector HNSW 参数怎么调
    note: 索引调优
    body: |
      HNSW 索引有两个建索引参数：m（每个节点的连接数，默认 16）和 ef_construction（建索引时的候选列表大小，默认 64）。我们的数据集上 m 取 24、ef_construction 取 200 时召回率最好，建索引时间约为默认值的 3 倍。

      查询时的 hnsw.ef_search 默认 40，调到 100 后召回率从 0.93 提升到 0.98，延迟增加约 30%。

