  - id: a1-08
    account: eval_a
    project: A1
    type: url
    url: https://example.com/blog/langgraph-checkpointer
    title: LangGraph 检查点：让长流程在崩溃后继续
    note: Worker 恢复
    body: |
      LangGraph 的 checkpointer 会在每个节点执行后保存图的状态，进程崩溃后用同一个 thread_id 调用即可从最后一个完成的节点继续，而不是从头再跑。PostgreSQL 版本的 checkpointer 把状态存进 checkpoints、checkpoint_blobs、checkpoint_writes 三张表。

      要注意持久化模式：默认的 async 模式在下一个节点执行的同时异步写检查点，如果恰好在这时崩溃，最后一步会丢失；对外部副作用多的流程应该用 sync 模式，每步写完再继续。

      检查点只能保证“从哪里继续”，不能保证节点本身不重复执行。节点在提交外部写入之后、检查点保存之前崩溃，重放时这个节点会再跑一次，所以每个节点都要做成幂等的：先查结果是否已存在，存在就跳过。

      检查点里最好只放 ID，不放大段正文。这样删除用户资料时，不会在检查点里残留已删除的内容。

