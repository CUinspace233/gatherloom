name: gatherloom
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: gatherloom
      POSTGRES_USER: gatherloom
      POSTGRES_PASSWORD: gatherloom-local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatherloom -d gatherloom"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
